<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Contacto - Eva Pérez</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 24px;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#11d4d4",
                        "background-light": "#f6f8f8",
                        "background-dark": "#102222",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<a href="index.html" class="text-gray-800 dark:text-white flex size-12 shrink-0 items-center">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Contacto</h2>
<div class="flex w-12 items-center justify-end">
<!-- Placeholder for potential right icon -->
</div>
</div>
<main class="flex-grow px-4">
<!-- Headline Text -->
<h1 class="text-gray-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-left pb-3 pt-6">Solicitar Consulta</h1>
<!-- Body Text -->
<p class="text-gray-600 dark:text-gray-300 text-base font-normal leading-normal pb-6">Iniciemos la conversación sobre su próximo proyecto de bienestar.</p>
<!-- Form -->
<form action="#" class="space-y-4" method="POST">
<!-- Text Field: Nombre -->
<div class="flex flex-col">
<label class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2" for="nombre">Nombre</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-primary/20 bg-background-light dark:bg-background-dark/30 h-14 placeholder:text-gray-400 dark:placeholder:text-primary/40 p-[15px] text-base font-normal leading-normal focus:border-primary" id="nombre" name="nombre" placeholder="Ingrese su nombre completo" type="text" value=""/>
<!-- Text Field: Email -->
<div class="flex flex-col">
<label class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2" for="email">Email</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-primary/20 bg-background-light dark:bg-background-dark/30 h-14 placeholder:text-gray-400 dark:placeholder:text-primary/40 p-[15px] text-base font-normal leading-normal focus:border-primary" id="email" name="email" placeholder="Ingrese su email profesional" type="email" value=""/>
<!-- Text Field: Empresa -->
<div class="flex flex-col">
<label class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2" for="empresa">Empresa</label>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-primary/20 bg-background-light dark:bg-background-dark/30 h-14 placeholder:text-gray-400 dark:placeholder:text-primary/40 p-[15px] text-base font-normal leading-normal focus:border-primary" id="empresa" name="empresa" placeholder="Hotel / Empresa" type="text" value=""/>
<!-- Text Area: Mensaje -->
<div class="flex flex-col">
<label class="text-gray-800 dark:text-white text-base font-medium leading-normal pb-2" for="mensaje">¿Cómo puedo ayudarle?</label>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-primary/20 bg-background-light dark:bg-background-dark/30 h-32 placeholder:text-gray-400 dark:placeholder:text-primary/40 p-[15px] text-base font-normal leading-normal focus:border-primary" id="mensaje" name="mensaje" placeholder="Describa brevemente su proyecto o consulta..."></textarea>
</div></div></div></div></form>
</main>
<!-- CTA Button & Footer -->
<div class="sticky bottom-0 bg-background-light dark:bg-background-dark p-4 pt-6 pb-8">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 bg-primary text-background-dark gap-2 text-base font-bold leading-normal tracking-[0.015em]">
                Enviar Solicitud
            </button>
<p class="text-center text-xs text-gray-500 dark:text-gray-400 pt-4">Al enviar, acepta nuestra Política de Privacidad.</p>
</div>
</div>
</body>
</html>
